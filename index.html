   const n=$('#fn').value.trim();
   if(n.length<3)throw{message:'Ad və soyadı tam yazın.'};
   if(!/^[a-z0-9_.]{3,20}$/.test(u))throw{message:'İstifadəçi adı 3–20 simvol: a-z, 0-9, _ və ya nöqtə.'};
   if(p.length<6)throw{message:'Şifrə ən azı 6 simvol olmalıdır.'};
   if(p!==$('#fp2').value)throw{message:'Şifrələr eyni deyil.'};
   let code='';if(role==='t'){code=$('#fcode').value.trim().toUpperCase();if(!code)throw{message:'Müəllim giriş kodunu yazın.'}}
   cred=await createUserWithEmailAndPassword(auth,mail(u),p);
   const id=cred.user.uid,b=writeBatch(db);let prof;
   if(role==='t'){const tid=rnd(6);prof={r:'t',u,n,tid,code,ts:Date.now()};b.set(doc(db,'used',code),{uid:id});b.set(doc(db,'tids',tid),{uid:id})}
   else{const g=$('#fg').value,l=$('#fl').value.trim().toUpperCase().slice(0,1);prof={r:'s',u,n,g,cl:g+l,ts:Date.now()}}
   b.set(doc(db,'users',id),prof);
   try{await b.commit()}catch(x){try{await cred.user.delete()}catch(y){}throw{message:role==='t'?'Müəllim kodu yanlışdır və ya artıq istifadə olunub.':emsg(x)}}
   me={...prof,id};
  }
  ls.set('tz_u',u);toast('Xoş gəldiniz, '+me.n);
  busy=false;
  if(me.r==='s'&&pend){const c=pend;pend=null;go('s');startCode(c)}else go(me.r)
 }catch(x){busy=false;btn.disabled=false;er.textContent=x.code?emsg(x):x.message}
}

/* ---------- müəllim paneli ---------- */
function tView(){
 const gr=Array.from({length:11},(_,i)=>`<option value="${i+1}"${i==6?' selected':''}>${i+1}-ci sinif</option>`).join('');
 app(`<div class="card row"><div><b>Salam, ${esc(me.n)}</b><div class="mut sm">Müəllim kodunuz: <b>${me.tid}</b></div></div><button class="btn ghost" id="tcp">Kodu kopyala</button></div>
<div class="card"><h2>Fənni seçin</h2><div class="tiles">${NM.map(n=>`<button class="tile" data-n="${n}" style="background:linear-gradient(135deg,${DB[n].c[0]},${DB[n].c[1]})"><b>${DB[n].e}</b>${n}</button>`).join('')}</div>
<div class="grid"><label>Sinif<select id="grade">${gr}</select></label><label>Fənn<select id="subj"><option value="">Seçin</option>${NM.map(n=>`<option>${n}</option>`).join('')}</select></label><label>Mövzu<select id="topic" disabled></select></label><label>Sual sayı<select id="cnt"><option>4</option><option selected>6</option></select></label></div>
<button class="btn" id="gen" style="margin-top:1rem" disabled>Test yarat</button></div>
<section id="out" class="hidden">
<div class="card"><h2>Bal qrupları</h2><div id="groups" class="grid"></div></div>
<div class="row" style="margin-top:1.2rem"><h2>Test kartları</h2><div class="row"><button class="btn t" id="key">Cavab açarı</button><button class="btn" id="pdf">PDF yüklə</button><button class="btn g" id="wa">WhatsApp</button><button class="btn a" id="stu">Şagird rejimi</button><button class="btn r" id="delt">Testi sil</button></div></div>
<div id="cards" class="grid" style="margin-top:.8rem;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"></div>
<div class="card"><h2>Şagirdlərə göndəriləcək link</h2><div class="row" style="justify-content:flex-start"><input id="link" readonly style="max-width:34rem"><button class="btn ghost" id="copy">Kopyala</button></div>
<h2 style="margin-top:1.4rem">Sinfin nəticələri <span class="chip" style="background:var(--ok)">canlı</span></h2><p class="mut sm" id="note"></p><div class="row" style="justify-content:flex-start" id="stats"></div>
<h3 style="margin-top:1rem">Sinif üzrə</h3><div id="cls"></div><h3 style="margin-top:1rem">Mövzu üzrə (%)</h3><div id="chart"></div><h3 style="margin-top:1rem">Şagirdlər</h3><div id="tbl" style="overflow-x:auto"></div></div></section>`);
 $('#tcp').onclick=()=>{try{navigator.clipboard.writeText(me.tid)}catch(e){}toast('Kopyalandı')};
 const pick=n=>{$('#subj').value=n;const t=$('#topic');t.disabled=false;t.innerHTML=DB[n].t.map(x=>`<option>${x}</option>`).join('');document.querySelectorAll('.tile').forEach(b=>b.classList.toggle('on',b.dataset.n===n));$('#gen').disabled=false};
 document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>pick(b.dataset.n));
 $('#subj').onchange=e=>e.target.value&&pick(e.target.value);
 $('#gen').onclick=()=>{const sn=$('#subj').value,ti=DB[sn].t.indexOf($('#topic').value);cur=`t-${$('#grade').value}-${NM.indexOf(sn)}-${ti}-${$('#cnt').value}-${me.tid}`;ls.set('tz_last:'+me.u,cur);key=false;load();render();$('#out').scrollIntoView()};
 $('#delt').onclick=()=>{if(!confirm('Testi silmək istəyirsiniz? Nəticələr qalacaq.'))return;ls.set('tz_last:'+me.u,null);test=[];cur='';$('#out').classList.add('hidden')};
 $('#key').onclick=()=>{key=!key;render()};
 $('#pdf').onclick=()=>{key=true;render();setTimeout(()=>{try{window.print()}catch(e){}},500)};
 $('#wa').onclick=()=>{window.open('https://wa.me/?text='+encodeURIComponent('Salam! Testi həll edin (hesab yaradın):\n'+$('#link').value),'_blank')};
 $('#copy').onclick=()=>{try{navigator.clipboard.writeText($('#link').value)}catch(e){$('#link').select()}toast('Link kopyalandı')};
 $('#stu').onclick=()=>{const p=parse(cur);if(p)openStu(test,cur,true,p,null)};
 unsubs.push(onSnapshot(query(collection(db,'results'),where('tu','==',me.id)),sn=>{allR=sn.docs.map(d=>d.data());if(test.length)stats()},e=>toast('Nəticələri oxumaq mümkün olmadı')));
 const z=ls.get('tz_last:'+me.u),p=parse(z);if(p){cur=p.code;load();render()}else{test=[];cur=''}}
function load(){const p=parse(cur);test=mk(p.sn,p.ti,p.n)}
function render(){
 $('#out').classList.remove('hidden');
 const tot=test.reduce((a,q)=>a+LV[q.lv][1],0);
 $('#groups').innerHTML=LV.map((l,i)=>{const c=test.filter(q=>q.lv===i).length;return `<div class="card" style="margin:0;border-left:6px solid ${l[2]}"><div class="mut sm">${l[0]}</div><b>${c} sual</b><div class="sm">${l[1]} bal × ${c} = ${c*l[1]}</div></div>`}).join('')+`<div class="card" style="margin:0;background:var(--ac);color:#fff"><div class="sm">Cəmi</div><b>${tot} bal</b></div>`;
 $('#cards').innerHTML=test.map((q,i)=>`<article class="card" style="margin:0"><div class="row"><span class="chip" style="background:${LV[q.lv][2]}">${LV[q.lv][0]} · ${LV[q.lv][1]} bal</span><span class="mut sm">${q.t}</span></div><h3 style="margin-top:.5rem">${i+1}. ${esc(q.q)}</h3>${q.o.map((o,j)=>`<div class="opt${key&&j===q.a?' ok':''}"><b>${'ABCD'[j]}</b> ${esc(o)}</div>`).join('')}${key?`<p class="sm"><b>Cavab: ${'ABCD'[q.a]}.</b> <span class="mut">${esc(q.e)}</span></p>`:''}</article>`).join('');
 $('#link').value=location.href.split('#')[0]+'#'+cur;stats()}
const sc=r=>[...r.a].filter(x=>x==='1').length,PC=r=>Math.round(sc(r)/r.a.length*100);
const clr=p=>p<50?'var(--bad)':p<75?'var(--am)':'var(--ok)';
const B=(l,p)=>`<div style="margin-top:.5rem"><div class="row sm" style="font-weight:700"><span>${esc(l)}</span><span>${p}%</span></div><div class="bar"><i style="width:${p}%;background:${clr(p)}"></i></div></div>`;
function stats(){
 if(!$('#stats'))return;
 const m={};allR.filter(r=>r.c===cur).sort((a,b)=>a.ts-b.ts).forEach(r=>m[r.su]=r);const R=Object.values(m),n=R.length;
 const avg=n?Math.round(R.reduce((a,r)=>a+PC(r),0)/n):null;
 const T=[...new Set(test.map(q=>q.t))];
 const tp=T.map(t=>{let a=0,b=0;test.forEach((q,i)=>{if(q.t===t)R.forEach(r=>{b++;if(r.a[i]==='1')a++})});return[t,b?Math.round(a/b*100):null]}).filter(x=>x[1]!==null);
 const G={};R.forEach(r=>(G[r.cl||'-']=G[r.cl||'-']||[]).push(r));
 const cl=Object.entries(G).sort().map(([c,a])=>[`${c} sinfi · ${a.length} şagird · keçmə ${Math.round(a.filter(r=>PC(r)>=50).length/a.length*100)}%`,Math.round(a.reduce((x,r)=>x+PC(r),0)/a.length)]);
 const weak=[...tp].sort((a,b)=>a[1]-b[1])[0];
 $('#note').textContent=n?`${n} şagirdin nəticəsi (hər şagirdin son cəhdi).`:'Hələ nəticə yoxdur. Şagird testi bitirən kimi burada avtomatik görünəcək.';
 $('#stats').innerHTML=[['Şagird',n],['Siniflər',cl.length],['Orta nəticə',avg===null?'-':avg+'%'],['Zəif mövzu',weak?weak[0]:'-']].map(x=>`<div class="card" style="margin:0;min-width:140px"><div class="mut sm">${x[0]}</div><b>${esc(x[1])}</b></div>`).join('');
 $('#cls').innerHTML=cl.length?cl.map(x=>B(x[0],x[1])).join(''):'<p class="mut">-</p>';
 $('#chart').innerHTML=tp.length?tp.map(x=>B(x[0],x[1])).join(''):'<p class="mut">-</p>';
 $('#tbl').innerHTML=n?`<table><tr class="mut"><th>Şagird</th><th>Sinif</th><th>Düz</th><th>%</th></tr>${R.map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(r.cl||'-')}</td><td>${sc(r)}/${r.a.length}</td><td><b>${PC(r)}%</b></td></tr>`).join('')}</table>`:'<p class="mut">-</p>'}

/* ---------- şagird paneli ---------- */
function sView(){
 app(`<div class="card row"><div><h2>Salam, ${esc(me.n)}</h2><p class="mut" style="margin:0">${esc(me.u)} · ${esc(me.cl)} sinfi</p></div><div class="row" id="sstat"></div></div>
<div class="card"><h3>Test kodu və ya linki</h3><p class="mut sm">Müəllimin göndərdiyi kodu yazın.</p><div class="row" style="justify-content:flex-start"><input id="code" style="max-width:24rem" placeholder="t-7-0-1-6-AB12CD"><button class="btn t" id="go">Testi başla</button></div><p class="err" id="cerr"></p></div>
<div class="card"><h2>Mənim nəticələrim</h2><p class="mut sm">Bütün cihazlarda eyni görünür.</p><div id="hist"></div></div>`);
 $('#go').onclick=()=>startCode($('#code').value);
 $('#hist').onclick=e=>{const b=e.target.closest('[data-rev]');if(b){const r=myR.find(x=>String(x.ts)===b.dataset.rev);if(r)review(r)}};
 unsubs.push(onSnapshot(query(collection(db,'results'),where('su','==',me.id)),sn=>{myR=sn.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts);hist()},()=>toast('Tarixçəni oxumaq mümkün olmadı')))}
function hist(){
 if(!$('#hist'))return;
 const pc=myR.map(r=>Math.round(sc(r)/r.a.length*100));
 $('#sstat').innerHTML=[['Test sayı',myR.length],['Orta nəticə',pc.length?Math.round(pc.reduce((a,b)=>a+b,0)/pc.length)+'%':'-']].map(x=>`<div class="card" style="margin:0"><div class="mut sm">${x[0]}</div><b>${x[1]}</b></div>`).join('');
 $('#hist').innerHTML=myR.length?myR.map(r=>{const p=parse(r.c);if(!p)return'';return `<div class="row card" style="margin:.5rem 0"><span><b>${DB[p.sn].t[p.ti]}</b> <span class="mut sm">${p.sn} · ${new Date(r.ts).toLocaleDateString('az-AZ')}</span></span><span class="row"><span class="chip" style="background:var(--tl)">${sc(r)}/${r.a.length} · ${Math.round(sc(r)/r.a.length*100)}%</span><button class="btn ghost" data-rev="${r.ts}">Bax</button></span></div>`}).join(''):'<p class="mut">Hələ test həll etməmisiniz.</p>'}
async function startCode(c){
 const p=parse(c),er=$('#cerr');
 if(!p){if(er)er.textContent='Kod yanlışdır (məs. t-7-0-1-6-AB12CD).';return}
 try{const s=await getDoc(doc(db,'tids',p.tid));if(!s.exists()){if(er)er.textContent='Bu müəllim kodu tapılmadı.';return}
  if(er)er.textContent='';openStu(mk(p.sn,p.ti,p.n),p.code,false,p,s.data().uid)}catch(e){if(er)er.textContent=emsg(e)}}

/* ---------- test həlli və təhlil ---------- */
function openStu(t,cd,prev,p,tu){
 const m=$('#mbox');
 m.innerHTML=`<div class="row"><div><h2>${p.sn} testi</h2><p class="mut sm">${DB[p.sn].t[p.ti]} · ${p.g}-ci sinif</p></div><button class="btn ghost" id="cl">Bağla</button></div><p class="mut sm">${prev?'Önizləmə: nəticə yadda saxlanmır.':'Şagird: <b>'+esc(me.n)+'</b>'}</p><div class="bar" style="margin-top:.6rem"><i id="pb" style="width:0;background:var(--ac)"></i></div><p class="sm" id="prg">0 / ${t.length}</p>`+
 t.map((q,i)=>`<div style="margin-top:1rem"><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<label class="opt" style="font-weight:400;margin-top:.4rem"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('')+`<button class="btn g" style="margin-top:1.2rem" id="sub">Cavabları göndər</button><div id="sr"></div>`;
 $('#cl').onclick=closeM;
 m.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{m.querySelectorAll(`input[name="${r.name}"]`).forEach(x=>x.parentElement.classList.toggle('sel',x.checked));const d=t.filter((q,i)=>m.querySelector(`input[name="q${i}"]:checked`)).length;$('#prg').textContent=`${d} / ${t.length}`;$('#pb').style.width=Math.round(d/t.length*100)+'%'});
 $('#modal').classList.add('on');
 $('#sub').onclick=async()=>{
  const sel=t.map((q,i)=>{const c=m.querySelector(`input[name="q${i}"]:checked`);return c?+c.value:-1});
  const a=t.map((q,i)=>sel[i]===q.a),k=a.filter(Boolean).length;
  const rec={c:cd,tid:p.tid,tu:tu||'',su:me.id,n:me.n,cl:me.cl||'',a:a.map(x=>+x).join(''),s:sel,ts:Date.now()};
  const b=$('#sub');b.disabled=true;
  if(!prev){try{await addDoc(collection(db,'results'),rec)}catch(e){b.disabled=false;$('#sr').innerHTML=`<p class="err">Nəticə göndərilmədi: ${esc(emsg(e))}</p>`;return}}
  b.remove();
  $('#sr').innerHTML=`<div class="card" style="border-left:6px solid var(--tl)"><h2>${k} / ${t.length} düz · ${Math.round(k/t.length*100)}%</h2><p class="mut">${prev?'Önizləmə nəticəsi.':'Nəticəniz müəllimə avtomatik göndərildi.'} ${k*2>=t.length?'Əla nəticə!':'Səhvlərinizi təhlil edin.'}</p><button class="btn" id="rev">Cavabları gör</button></div>`;
  $('#rev').onclick=()=>review(rec)}}
function review(rec){
 const p=parse(rec.c);if(!p)return;const qs=mk(p.sn,p.ti,p.n),s=rec.s||[];
 $('#mbox').innerHTML=`<div class="row"><div><h2>Cavabların təhlili</h2><p class="mut sm">${p.sn} · ${DB[p.sn].t[p.ti]} · ${sc(rec)} / ${qs.length} düz</p></div><button class="btn ghost" id="cl">Bağla</button></div>`+qs.map((q,i)=>{const ok=rec.a[i]==='1',ch=s[i]??-1;return `<div class="card" style="border-color:${ok?'var(--ok)':'var(--bad)'}"><div class="row"><b>${i+1}. ${esc(q.q)}</b><span class="chip" style="background:${ok?'var(--ok)':'var(--bad)'}">${ok?'Düz':'Səhv'}</span></div>${q.o.map((o,j)=>`<div class="opt ${j===q.a?'ok':(j===ch&&!ok?'bad':'')}"><b>${'ABCD'[j]}</b> ${esc(o)}${j===ch?' <span class="mut sm">(sizin cavab)</span>':''}</div>`).join('')}${!ok&&ch<0?'<p class="mut sm">Cavab verilməyib.</p>':''}<p class="sm"><b>İzah:</b> <span class="mut">${esc(q.e)}</span></p></div>`}).join('');
 $('#cl').onclick=closeM;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
</script>
</body>
</html>
